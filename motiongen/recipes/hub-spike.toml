# Hub-pose spike, Kimodo arm (AN44b, Scrib docs/roadmaps/anim.md; rule: Scrib motion-generation.md "Interaction pieces
# and hub poses", AN43). The same 3 pieces are generated by the ARDY (AN44c) and MotionBricks (AN44d) arms; `motiongen
# hubcheck` measures hub error at both ends and foot slide. Hubs from recipes/hubs.toml (stand.idle, sit.chair, the
# seat48 band). Run with --hub-root "<scrib>/animation packs/generated". point = ground: one job each (the seat height
# comes from the hub pose itself, so no band pelvis_height, which would clash with the pose keys). 8 seeds each.

[[activity]]
id = "spike.kimodo.stand_to_sit"
point = "ground"
props = []
phases = ["act"]
variants = 8
duration = 3.0
prompt = "A person standing with their back to a chair sits down on it."
constraints.act = { start_pose = "hub:stand.idle", end_pose = "hub:sit.chair", root = "fixed_xz" }

[[activity]]
id = "spike.kimodo.seated_reach_cup"
point = "ground"
props = []
phases = ["act"]
variants = 8
duration = 4.0
prompt = "A person sitting on a chair reaches forward, picks up a cup, drinks and puts it back."
constraints.act = { start_pose = "hub:sit.chair", end_pose = "hub:sit.chair", root = "fixed" }

[[activity]]
id = "spike.kimodo.sit_to_stand"
point = "ground"
props = []
phases = ["act"]
variants = 8
duration = 3.0
prompt = "A person sitting on a chair leans forward and stands up."
constraints.act = { start_pose = "hub:sit.chair", end_pose = "hub:stand.idle", root = "fixed_xz" }
