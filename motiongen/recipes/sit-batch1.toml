point = "seat_stool"
phases = ["loop"]
variants = 8
duration = 8.0
prompt = "A person sitting on a tall stool without a backrest fidgets, shifting their weight, scratching their arm, rubbing their knee and looking around, then settles with hands on their thighs."
constraints.loop = { pelvis_height = "band.seat_stool+0.10", root = "fixed" }

[[activity]]
id = "seat.chair.fidget"
point = "seat_chair"
phases = ["loop"]
variants = 8
duration = 8.0
prompt = "A person sitting on a chair fidgets, shifting their weight, scratching their arm, rubbing their knee and looking around, then settles with hands on their thighs."
constraints.loop = { pelvis_height = "band.seat_chair+0.10", root = "fixed" }

[[activity]]
id = "seat.bench.fidget"
point = "seat_bench"
phases = ["loop"]
variants = 8
duration = 8.0
prompt = "A person sitting on a wooden bench fidgets, shifting their weight, stretching their back, rubbing their hands together and looking around, then settles with hands on their knees."
constraints.loop = { pelvis_height = "band.seat_bench+0.10", root = "fixed" }

[[activity]]
id = "seat.floor.fidget"
point = "seat_floor"
phases = ["loop"]
variants = 8
duration = 8.0
prompt = "A person sitting cross-legged on a low cushion on the floor fidgets, shifting their weight, stretching their back, scratching their arm and looking around, then settles with hands on their knees."
