[[activity]]
id = "seat.chair.old.fidget"
point = "seat_chair_old"
phases = ["loop"]
variants = 8
duration = 8.0
prompt = "An old, frail person sitting hunched on a chair slowly rubs their aching knee, shifts their weight and coughs, then settles with hands on their thighs."
constraints.loop = { pelvis_height = "band.seat_chair_old+0.10", root = "fixed" }

# --- old standing idle (stand.idle@old hub source) ----------------------------------------------------------------------

[[activity]]
id = "stand.idle.old"
point = "ground"
phases = ["loop"]
variants = 8
duration = 5.0
prompt = "An old, frail person stands still with a slightly hunched back and arms hanging at their sides, breathing slowly."
constraints.loop = { root = "fixed" }

# --- second pass: seat height (pass 1 measured the Hips at 0.53-0.57 m on every chair band, 0.12-0.14 m (on the
# floor) for the stool rest, 0.56-0.63 m for the stool fidget: the pelvis_height key alone does not lift the body).
# Same targets, constraint guidance raised (cfg_weight [text, constraint], Kimodo default [2, 2]) and the stool
# prompts name the high seat. Run with --only 'seat.*.high.*'.

[[activity]]
id = "seat.stool.high.rest"
point = "seat_stool"
phases = ["loop"]
variants = 8
duration = 8.0
cfg_weight = [2.0, 5.0]
prompt = "A person perched on a high bar stool, hips high above their knees and legs slanting down to the floor, hands resting on their thighs, rests calmly, breathing slowly and glancing around."
constraints.loop = { pelvis_height = "band.seat_stool+0.10", root = "fixed" }

[[activity]]
id = "seat.stool.high.fidget"
point = "seat_stool"
phases = ["loop"]
variants = 8
duration = 8.0
cfg_weight = [2.0, 5.0]
prompt = "A person perched on a high bar stool, hips high above their knees and legs slanting down to the floor, fidgets, shifting their weight, scratching their arm and looking around, then settles with hands on their thighs."
constraints.loop = { pelvis_height = "band.seat_stool+0.10", root = "fixed" }

[[activity]]
id = "seat.chair.high.rest"
point = "seat_chair"
phases = ["loop"]
variants = 8
duration = 8.0
cfg_weight = [2.0, 5.0]
prompt = "A person sitting on a chair with both feet flat on the floor and hands resting on their thighs rests calmly, breathing slowly and glancing around."
constraints.loop = { pelvis_height = "band.seat_chair+0.10", root = "fixed" }

[[activity]]
id = "seat.chair.high.fidget"
point = "seat_chair"
phases = ["loop"]
variants = 8
duration = 8.0
cfg_weight = [2.0, 5.0]
prompt = "A person sitting on a chair fidgets, shifting their weight, scratching their arm, rubbing their knee and looking around, then settles with hands on their thighs."
constraints.loop = { pelvis_height = "band.seat_chair+0.10", root = "fixed" }
