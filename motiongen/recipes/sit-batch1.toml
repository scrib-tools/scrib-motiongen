# AN26a sit/stand batch 1, Kimodo half: the seated loops (rest, fidget) per seat family-band, and an old standing idle
# (the `stand.idle@old` hub source). Contract: Scrib motion-generation.md "Interaction families (AN25)" (seat family:
# enter.front, enter.left, loop x2, exit.front, exit.left; enter/exit are MotionBricks links, recipes/sit-batch1-links.toml).
# Run with --out "<scrib>/animation packs/generated/sit1": its bands.json gives one point kind per seat family
# (floor seat14, chair seat48 + seat54, bench seat48, stool seat64, old chair seat48; heights from the MG4 census).
# Pelvis at band + 0.10 like tier1's sit.chair.rest (the sit.chair hub source: 0.53 m pelvis at seat48).
# Loops are not hub-constrained here (their hubs are picked from these takes); the link recipe makes the kept loops
# start and end exactly on their hub (`[[hub_loop]]`). 8 seeds each (spec: 8 seeds per piece).

# --- rest: calm, low motion (hub sources) -----------------------------------------------------------------------------

[[activity]]
id = "seat.stool.rest"
point = "seat_stool"
phases = ["loop"]
variants = 8
duration = 8.0
prompt = "A person sitting upright on a tall stool without a backrest, both feet flat on the floor and hands resting on their thighs, rests calmly, breathing slowly and glancing around."
constraints.loop = { pelvis_height = "band.seat_stool+0.10", root = "fixed" }

[[activity]]
id = "seat.chair.rest"
point = "seat_chair"
phases = ["loop"]
variants = 8
duration = 8.0
prompt = "A person sitting on a chair with both feet flat on the floor and hands resting on their thighs rests calmly, breathing slowly and glancing around."
constraints.loop = { pelvis_height = "band.seat_chair+0.10", root = "fixed" }

[[activity]]
id = "seat.bench.rest"
point = "seat_bench"
phases = ["loop"]
variants = 8
duration = 8.0
prompt = "A person sitting on a wooden bench with both feet flat on the floor and hands resting on their knees rests calmly, breathing slowly and looking around."
constraints.loop = { pelvis_height = "band.seat_bench+0.10", root = "fixed" }

[[activity]]
id = "seat.floor.rest"
point = "seat_floor"
phases = ["loop"]
variants = 8
duration = 8.0
prompt = "A person sitting cross-legged on a low cushion on the floor with hands resting on their knees rests calmly, breathing slowly and looking around."
constraints.loop = { pelvis_height = "band.seat_floor+0.10", root = "fixed" }

[[activity]]
id = "seat.chair.old.rest"
point = "seat_chair_old"
phases = ["loop"]
variants = 8
duration = 8.0
prompt = "An old, frail person sitting hunched on a chair with both feet on the floor and hands resting on their thighs rests wearily, breathing slowly."
constraints.loop = { pelvis_height = "band.seat_chair_old+0.10", root = "fixed" }

# --- fidget: the second loop per family-band ---------------------------------------------------------------------------

