variants = [{ placement = { dx = 0.10, dz = 0.45, dyaw = 90 } }, { placement = { dx = 0.20, dz = 0.40, dyaw = 90 } }, { placement = { dx = 0.0, dz = 0.35, dyaw = 90 } }, { tokens = 16, placement = { dx = 0.10, dz = 0.45, dyaw = 90 } }]

