# AN26a sit/stand batch 1, MotionBricks half (README "link"): per seat family-band the enter / exit links
# (stand hub <-> seat hub) for the front and left sides (right = mirrored at the bake), and the seated loops made
# exact on their seat hub ([[hub_loop]]: link hub -> take start, the take, link take end -> hub, one joined take).
# Loop takes and hub sources were auto-picked from recipes/sit-batch1.toml's Kimodo takes by `motiongen grade`
# (ungated, best skate + jerk p99 rank; at most 4 per group). Run in the MotionBricks venv:
#   motiongen link motiongen/recipes/sit-batch1-links.toml --out "<scrib>/animation packs/generated/sit1"
#     --hub-root "<scrib>/animation packs/generated"
# Sides, slot frame (+Z = the way the seated user faces, user's left = +X): `front` = standing in front of the seat
# facing away from it, feet where the seated feet go (placement feet); `left` = standing at the seat's left front
# corner facing the seat (-X), a 90-degree left turn-in (dyaw +90) to sit; exit.left ends standing there facing +X
# (turned away, ready to walk off). Offsets dx (to the character's left) / dz (forward) are the variants' sweep.
# One MotionBricks segment each (<= 16 tokens, 1.93 s); variants sweep tokens and the side offset (no seeds).

# --- seat.stool at seat64: stand.idle <-> sit.stool ---------------------------------------------------

[[link]]
id = "seat.stool.enter.front.seat64"
from = "hub:stand.idle"
to = "hub:sit.stool"
placement = "feet"
variants = [{ tokens = [8, 14] }, { tokens = [12, 16] }, { tokens = 16 }, { tokens = [10, 16], placement = { dz = 0.08 } }]

[[link]]
id = "seat.stool.enter.left.seat64"
