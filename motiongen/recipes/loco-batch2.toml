# Locomotion batch 2 (AN4b, 2026-11-26): the speed/prompt sweep that decides how batch 3 forces speed. Plan from
# superfargoth/docs/research/animation/19-kimodo-prompting-2026-11-12.md section 6 (A speed sweep, B stops and turns,
# C starts; D below), its section 5 constraint recipe and section 4 prompt rules (6-15 words, present tense, no long
# body descriptions). AN1 findings on batch 1's shipped takes drive the prompt arms: walk arm swing 28 deg of range
# (Morrowind 70), jog cadence 3.33 steps/s (human ~2.8) with 83 cm/s stance skate, sprint skate 77 cm/s and the arms
# swing back only; batch 1 forced speed with sparse 1 Hz paths, here replaced by dense `profile:` roots (AN4a).
# Output "animation packs/generated/loco2/" (BYO, never committed; `--out .../loco2`). Format:
# bevyrrowind/docs/specs/motion-generation.md, "Recipes (MG1)"; the `profile:` and `cfg_weight` syntax: README "Recipes".
# Left and straight only: the right side comes from the graph's Mirror node. Canonical space: start at XZ (0, 0) facing
# +Z, left on +X. Ids carry "loco2." so they never collide with batch 1. Cycles are long takes (>= 5 strides after the
# ramp; the bake cuts a same-foot loop); steady profiles start with a short `ramp` so the take never starts at full speed
# (R19 section 3 point 2). Arm names: .free = no root constraint (speed control), .pNN = dense profile at N.N m/s,
# .sNN = sparse timed path (0.5 s keys) at N.N m/s, .cfgTC = cfg_weight [T, C], others = prompt arms.
# Best-guess dense speeds (R19 section 5: never key past what the free takes reach; retime at bake up to 1.15x walk,
# 1.3x run): walk 1.4, jog 3.5, sprint 3.5. The prompt arms reuse exactly those constraints and change the prompt only.
# Left out: D (sampling steps 50 vs 100): steps is not a recipe field but the run-wide `--steps` flag (default 50); run
# a second pass with `--steps 100` into another folder on a subset if wanted. Turn-in-place end-heading keys: the
# profile keys a heading only with a `ramp` (travel), so in-place turns stay `fixed_xz` with no heading key.

